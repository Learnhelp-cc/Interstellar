<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search History Management</title>
    <link rel="stylesheet" href="/assets/css/global.css?v=6">
    <link rel="stylesheet" href="/assets/css/container.css?v=2">
    <link rel="stylesheet" href="/assets/css/nav.css?v=01">
    <style>
        .search-history-container {
            max-width: 1200px;
            margin: 40px auto 20px auto;
            padding: 20px;
            background: rgba(240, 240, 240, 0.5);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            border: 1px solid #d0d0d0;
        }
        
        .search-history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        .search-history-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }
        
        .search-history-tabs button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: #f5f5f5;
            color: #333;
            cursor: pointer;
            border-radius: 4px;
            font-weight: bold;
        }
        
        .search-history-tabs button.active {
            background: #333;
            color: white;
            border-color: #333;
        }
        
        .search-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 6px;
            overflow: hidden;
            box-sizing: border-box;
        }
        
        .search-controls .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
            min-width: 0; /* Prevent overflow */
        }
        
        .search-controls label {
            font-size: 12px;
            font-weight: bold;
            color: #333;
            text-transform: uppercase;
            letter-spacing: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .search-controls input,
        .search-controls select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #333;
            font-size: 14px;
            box-sizing: border-box;
            width: 100%;
            min-width: 0;
        }
        
        .search-controls .actions-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-self: end;
        }
        
        .search-controls button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #333;
            color: white;
            font-weight: bold;
            white-space: nowrap;
            min-width: 120px;
        }
        
        .search-controls .btn-secondary {
            background: #666;
        }
        
        .bulk-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .bulk-actions select {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            background: #fff;
            color: #333;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #ddd;
        }
        
        .history-table th,
        .history-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
            color: #333;
            vertical-align: top;
        }
        
        .history-table th {
            background: #f5f5f5;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 1;
            border-bottom: 2px solid #ddd;
        }
        
        .history-table tbody tr:hover {
            background: #f9f9f9;
        }
        
        .history-actions {
            display: flex;
            gap: 8px;
        }
        
        .history-actions button {
            padding: 4px 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            background: #666;
            color: white;
        }
        
        .btn-view {
            background: #666;
        }
        
        .btn-delete {
            background: #333;
        }
        
        .btn-select {
            background: #999;
        }
        
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        
        .domain-badge {
            background: #f5f5f5;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 12px;
            color: #333;
        }
        
        .date-time {
            font-size: 12px;
            color: #666;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            text-align: center;
        }
        
        .stat-number {
            font-size: 24px;
            font-weight: bold;
            color: #333;
        }
        
        .stat-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 5px;
        }
        
        .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-top: 20px;
        }
        
        .pagination button {
            padding: 8px 16px;
            border: 1px solid #ccc;
            background: #fff;
            color: #333;
            cursor: pointer;
            border-radius: 4px;
        }
        
        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .no-data {
            text-align: center;
            padding: 40px;
            color: #666;
            font-style: italic;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .filters-active {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
        
        .filter-badge {
            background: #333;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        
        .filter-badge .remove-filter {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }
    </style>
</head>
<body class="center">
    <div id="particles-js">
        <div class="f-nav"></div>
        <div class="main">
            <div class="search-history-container">
                <div class="search-history-header">
                    <h1>Search History Management</h1>
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number" id="total-entries">0</div>
                            <div class="stat-label">Total Entries</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="unique-users">0</div>
                            <div class="stat-label">Unique Users</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="unique-domains">0</div>
                            <div class="stat-label">Unique Domains</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number" id="today-entries">0</div>
                            <div class="stat-label">Today's Entries</div>
                        </div>
                    </div>
                </div>
                
                <div class="search-history-tabs">
                    <button class="active" onclick="switchTab('recent')" id="tab-recent">Recent</button>
                    <button onclick="switchTab('user')" id="tab-user">By User</button>
                    <button onclick="switchTab('website')" id="tab-website">By Website</button>
                </div>
                
                <div class="filters-active" id="filters-display">
                    <!-- Active filters will be displayed here -->
                </div>
                
                <div class="search-controls">
                    <div class="form-group">
                        <label>Search Domain</label>
                        <input type="text" id="domain-filter" placeholder="Filter by domain...">
                    </div>
                    <div class="form-group">
                        <label>Search User</label>
                        <input type="text" id="user-filter" placeholder="Filter by username...">
                    </div>
                    <div class="form-group">
                        <label>From Date</label>
                        <input type="date" id="date-from">
                    </div>
                    <div class="form-group">
                        <label>To Date</label>
                        <input type="date" id="date-to">
                    </div>
                    <div class="form-group">
                        <label>User ID</label>
                        <input type="number" id="user-id-filter" placeholder="Filter by user ID...">
                    </div>
                    <div class="actions-group">
                        <button onclick="applyFilters()">Apply Filters</button>
                        <button class="btn-secondary" onclick="clearFilters()">Clear</button>
                    </div>
                </div>
                
                <div class="bulk-actions">
                    <select id="bulk-action">
                        <option value="">Bulk Actions</option>
                        <option value="delete">Delete Selected</option>
                        <option value="delete-user">Delete User's History</option>
                    </select>
                    <button onclick="applyBulkAction()">Apply</button>
                    <button class="btn-secondary" onclick="exportHistory()">Export</button>
                    <button class="btn-secondary" onclick="clearAllHistory()">Clear All History</button>
                </div>
                
                <div style="overflow-x: auto;">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th><input type="checkbox" id="select-all"></th>
                                <th>User</th>
                                <th>Domain</th>
                                <th>Title</th>
                                <th>Date/Time</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="history-table-body">
                            <tr>
                                <td colspan="6" class="loading">Loading search history...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <div class="pagination">
                    <button onclick="previousPage()" id="prev-btn">Previous</button>
                    <span id="page-info">Page 1</span>
                    <button onclick="nextPage()" id="next-btn">Next</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js" async></script>
    <script src="./assets/mathematics/bundle.js?v=2025-04-15" defer></script>
    <script src="./assets/mathematics/config.js?v=2025-04-15" defer></script>
    <script src="/assets/js/m1.js" defer></script>
    <script src="/assets/js/s1.js" defer></script>
    <script src="/assets/js/h1.js" defer></script>
    
    <script>
        let allHistory = [];
        let filteredHistory = [];
        let currentPage = 1;
        const itemsPerPage = 20;
        let currentTab = 'recent';
        let currentSort = { field: 'visited_at', direction: 'DESC' };

        // Check authentication
        async function checkAuth() {
            // Check if user is already authenticated via basic auth
            const response = await fetch('/api/admin/search-history', {
                method: 'GET'
            });

            if (response.ok) {
                // Already authenticated, load the page
                loadHistory();
                return;
            }

            if (response.status === 401) {
                // Not authenticated, show admin auth modal
                showAdminAuthModal();
            } else {
                // Other error
                console.error('Auth check failed:', response.status);
                showAdminAuthModal();
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            checkAuth();
            loadHistory();
            setupEventListeners();
        });

        function setupEventListeners() {
            document.getElementById('select-all').addEventListener('change', toggleSelectAll);
            document.getElementById('domain-filter').addEventListener('input', debounce(applyFilters, 300));
            document.getElementById('user-filter').addEventListener('input', debounce(applyFilters, 300));
            document.getElementById('user-id-filter').addEventListener('input', debounce(applyFilters, 300));
            document.getElementById('date-from').addEventListener('change', applyFilters);
            document.getElementById('date-to').addEventListener('change', applyFilters);
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        async function loadHistory() {
            try {
                // Try to use stored admin auth first
                const adminAuth = localStorage.getItem('adminAuth');
                let headers = {};
                
                if (adminAuth) {
                    headers['Authorization'] = `Basic ${adminAuth}`;
                }

                const response = await fetch('/api/admin/search-history', {
                    method: 'GET',
                    headers: headers
                });

                if (response.ok) {
                    allHistory = await response.json();
                    filteredHistory = [...allHistory];
                    renderTable();
                    updateStats();
                } else if (response.status === 401) {
                    // If unauthorized, show auth modal
                    showAdminAuthModal();
                } else {
                    console.error('Failed to load history');
                    document.getElementById('history-table-body').innerHTML = 
                        '<tr><td colspan="6" class="no-data">Failed to load search history</td></tr>';
                }
            } catch (error) {
                console.error('Error loading history:', error);
                document.getElementById('history-table-body').innerHTML = 
                    '<tr><td colspan="6" class="no-data">Error loading search history</td></tr>';
            }
        }

        function switchTab(tabName) {
            currentTab = tabName;
            
            // Update tab buttons
            document.querySelectorAll('.search-history-tabs button').forEach(btn => {
                btn.classList.remove('active');
            });
            document.getElementById(`tab-${tabName}`).classList.add('active');

            // Update sort based on tab
            if (tabName === 'recent') {
                currentSort = { field: 'visited_at', direction: 'DESC' };
            } else if (tabName === 'user') {
                currentSort = { field: 'username', direction: 'ASC' };
            } else if (tabName === 'website') {
                currentSort = { field: 'domain', direction: 'ASC' };
            }

            applyFilters();
        }

        function applyFilters() {
            let filtered = [...allHistory];

            // Apply domain filter
            const domainFilter = document.getElementById('domain-filter').value.trim().toLowerCase();
            if (domainFilter) {
                filtered = filtered.filter(item => 
                    item.domain.toLowerCase().includes(domainFilter)
                );
            }

            // Apply user filter
            const userFilter = document.getElementById('user-filter').value.trim().toLowerCase();
            if (userFilter) {
                filtered = filtered.filter(item => 
                    item.username.toLowerCase().includes(userFilter)
                );
            }

            // Apply user ID filter
            const userIdFilter = document.getElementById('user-id-filter').value.trim();
            if (userIdFilter) {
                filtered = filtered.filter(item => 
                    item.user_id.toString() === userIdFilter
                );
            }

            // Apply date filters
            const dateFrom = document.getElementById('date-from').value;
            const dateTo = document.getElementById('date-to').value;

            if (dateFrom) {
                const fromDate = new Date(dateFrom);
                filtered = filtered.filter(item => 
                    new Date(item.visited_at) >= fromDate
                );
            }

            if (dateTo) {
                const toDate = new Date(dateTo);
                toDate.setHours(23, 59, 59, 999); // Include the entire day
                filtered = filtered.filter(item => 
                    new Date(item.visited_at) <= toDate
                );
            }

            // Apply sorting based on current tab
            filtered.sort((a, b) => {
                let aVal, bVal;
                
                if (currentSort.field === 'visited_at') {
                    aVal = new Date(a.visited_at);
                    bVal = new Date(b.visited_at);
                } else if (currentSort.field === 'username') {
                    aVal = a.username.toLowerCase();
                    bVal = b.username.toLowerCase();
                } else if (currentSort.field === 'domain') {
                    aVal = a.domain.toLowerCase();
                    bVal = b.domain.toLowerCase();
                }

                if (aVal < bVal) return currentSort.direction === 'ASC' ? -1 : 1;
                if (aVal > bVal) return currentSort.direction === 'ASC' ? 1 : -1;
                return 0;
            });

            filteredHistory = filtered;
            currentPage = 1;
            renderTable();
            updateFiltersDisplay();
        }

        function clearFilters() {
            document.getElementById('domain-filter').value = '';
            document.getElementById('user-filter').value = '';
            document.getElementById('user-id-filter').value = '';
            document.getElementById('date-from').value = '';
            document.getElementById('date-to').value = '';
            applyFilters();
        }

        function updateFiltersDisplay() {
            const container = document.getElementById('filters-display');
            container.innerHTML = '';

            const filters = [];
            
            if (document.getElementById('domain-filter').value.trim()) {
                filters.push(`Domain: ${document.getElementById('domain-filter').value.trim()}`);
            }
            if (document.getElementById('user-filter').value.trim()) {
                filters.push(`User: ${document.getElementById('user-filter').value.trim()}`);
            }
            if (document.getElementById('user-id-filter').value.trim()) {
                filters.push(`User ID: ${document.getElementById('user-id-filter').value.trim()}`);
            }
            if (document.getElementById('date-from').value) {
                filters.push(`From: ${document.getElementById('date-from').value}`);
            }
            if (document.getElementById('date-to').value) {
                filters.push(`To: ${document.getElementById('date-to').value}`);
            }

            if (filters.length === 0) {
                container.innerHTML = '<span style="color: #666; font-style: italic;">No active filters</span>';
            } else {
                filters.forEach(filter => {
                    const badge = document.createElement('span');
                    badge.className = 'filter-badge';
                    badge.innerHTML = `${filter} <button class="remove-filter" onclick="clearFilters()">&times;</button>`;
                    container.appendChild(badge);
                });
            }
        }

        function renderTable() {
            const tbody = document.getElementById('history-table-body');
            tbody.innerHTML = '';

            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const pageHistory = filteredHistory.slice(startIndex, endIndex);

            if (pageHistory.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" class="no-data">No search history found</td></tr>';
                updatePagination(0);
                return;
            }

            pageHistory.forEach(item => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><input type="checkbox" value="${item.id}" class="history-checkbox"></td>
                    <td>
                        <div class="user-info">
                            <div class="user-avatar">${getInitials(item.username)}</div>
                            <div>
                                <div style="font-weight: bold;">${item.username}</div>
                                <div style="font-size: 12px; color: #666;">ID: ${item.user_id}</div>
                            </div>
                        </div>
                    </td>
                    <td>
                        <span class="domain-badge">${item.domain}</span>
                    </td>
                    <td>
                        <div style="max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">
                            ${item.title || 'No title'}
                        </div>
                    </td>
                    <td>
                        <div class="date-time">${formatDate(item.visited_at)}</div>
                    </td>
                    <td>
                        <div class="history-actions">
                            <button class="btn-view" onclick="viewHistoryItem('${item.url}')">Visit</button>
                            <button class="btn-delete" onclick="deleteHistoryItem(${item.id})">Delete</button>
                            <button class="btn-select" onclick="selectRow(this)">Select</button>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });

            updatePagination(filteredHistory.length);
        }

        function getInitials(username) {
            const names = username.split(' ');
            if (names.length >= 2) {
                return (names[0][0] + names[1][0]).toUpperCase();
            }
            return username.substring(0, 2).toUpperCase();
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleString();
        }

        function updatePagination(totalItems) {
            const totalPages = Math.ceil(totalItems / itemsPerPage);
            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = currentPage === totalPages;
        }

        function nextPage() {
            if (currentPage * itemsPerPage < filteredHistory.length) {
                currentPage++;
                renderTable();
            }
        }

        function previousPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('select-all');
            const checkboxes = document.querySelectorAll('.history-checkbox');
            checkboxes.forEach(checkbox => checkbox.checked = selectAll.checked);
        }

        function getSelectedItems() {
            const checkboxes = document.querySelectorAll('.history-checkbox:checked');
            return Array.from(checkboxes).map(cb => parseInt(cb.value));
        }

        function selectRow(button) {
            const row = button.closest('tr');
            const checkbox = row.querySelector('.history-checkbox');
            checkbox.checked = !checkbox.checked;
        }

        function viewHistoryItem(url) {
            window.open(url, '_blank');
        }

        async function deleteHistoryItem(id) {
            if (!confirm('Are you sure you want to delete this search history entry?')) {
                return;
            }

            try {
                const adminAuth = localStorage.getItem('adminAuth');
                if (!adminAuth) {
                    showAdminAuthModal();
                    return;
                }

                const response = await fetch(`/api/admin/search-history/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Basic ${adminAuth}`
                    }
                });

                if (response.ok) {
                    loadHistory();
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                console.error('Error deleting history item:', error);
                alert('Error deleting history item');
            }
        }

        async function applyBulkAction() {
            const selectedItems = getSelectedItems();
            if (selectedItems.length === 0) {
                alert('Please select items to perform bulk action');
                return;
            }

            const action = document.getElementById('bulk-action').value;
            if (!action) {
                alert('Please select a bulk action');
                return;
            }

            const adminAuth = localStorage.getItem('adminAuth');
            if (!adminAuth) {
                showAdminAuthModal();
                return;
            }

            if (action === 'delete') {
                if (!confirm(`Are you sure you want to delete ${selectedItems.length} selected items?`)) {
                    return;
                }

                try {
                    const response = await fetch('/api/admin/search-history/bulk', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Basic ${adminAuth}`
                        },
                        body: JSON.stringify({ history_ids: selectedItems })
                    });

                    if (response.ok) {
                        loadHistory();
                        document.getElementById('select-all').checked = false;
                    } else {
                        const error = await response.json();
                        alert('Error: ' + error.message);
                    }
                } catch (error) {
                    console.error('Error applying bulk action:', error);
                    alert('Error applying bulk action');
                }
            } else if (action === 'delete-user') {
                const userIds = [...new Set(selectedItems.map(id => {
                    const item = allHistory.find(h => h.id === id);
                    return item ? item.user_id : null;
                }).filter(id => id !== null))];

                if (userIds.length === 0) {
                    alert('No valid user IDs found in selection');
                    return;
                }

                if (!confirm(`Are you sure you want to delete all history for ${userIds.length} user(s)?`)) {
                    return;
                }

                try {
                    const response = await fetch('/api/admin/search-history/user-bulk', {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Basic ${adminAuth}`
                        },
                        body: JSON.stringify({ user_ids: userIds })
                    });

                    if (response.ok) {
                        loadHistory();
                        document.getElementById('select-all').checked = false;
                    } else {
                        const error = await response.json();
                        alert('Error: ' + error.message);
                    }
                } catch (error) {
                    console.error('Error deleting user history:', error);
                    alert('Error deleting user history');
                }
            }
        }

        async function exportHistory() {
            const dataStr = JSON.stringify(filteredHistory, null, 2);
            const dataBlob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `search_history_export_${new Date().toISOString().slice(0, 10)}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        async function clearAllHistory() {
            if (!confirm('Are you sure you want to clear ALL search history? This action cannot be undone.')) {
                return;
            }

            try {
                const adminAuth = localStorage.getItem('adminAuth');
                if (!adminAuth) {
                    showAdminAuthModal();
                    return;
                }

                const response = await fetch('/api/admin/search-history', {
                    method: 'DELETE',
                    headers: {
                        'Authorization': `Basic ${adminAuth}`
                    }
                });

                if (response.ok) {
                    loadHistory();
                    alert('All search history cleared successfully');
                } else {
                    const error = await response.json();
                    alert('Error: ' + error.message);
                }
            } catch (error) {
                console.error('Error clearing all history:', error);
                alert('Error clearing all history');
            }
        }

        function updateStats() {
            const totalEntries = allHistory.length;
            const uniqueUsers = new Set(allHistory.map(h => h.user_id)).size;
            const uniqueDomains = new Set(allHistory.map(h => h.domain)).size;
            
            // Count today's entries
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayEntries = allHistory.filter(h => {
                const date = new Date(h.visited_at);
                return date >= today;
            }).length;

            document.getElementById('total-entries').textContent = totalEntries;
            document.getElementById('unique-users').textContent = uniqueUsers;
            document.getElementById('unique-domains').textContent = uniqueDomains;
            document.getElementById('today-entries').textContent = todayEntries;
        }

        // Admin authentication modal
        function showAdminAuthModal() {
            // Create modal overlay
            const overlay = document.createElement('div');
            overlay.id = 'admin-auth-overlay';
            overlay.style.position = 'fixed';
            overlay.style.top = '0';
            overlay.style.left = '0';
            overlay.style.width = '100vw';
            overlay.style.height = '100vh';
            overlay.style.backgroundColor = 'rgba(0, 0, 0, 0.8)';
            overlay.style.display = 'flex';
            overlay.style.justifyContent = 'center';
            overlay.style.alignItems = 'center';
            overlay.style.zIndex = '9999';
            overlay.style.backdropFilter = 'blur(5px)';

            // Create modal content
            const modal = document.createElement('div');
            modal.style.background = 'white';
            modal.style.padding = '40px';
            modal.style.borderRadius = '12px';
            modal.style.textAlign = 'center';
            modal.style.boxShadow = '0 10px 30px rgba(0,0,0,0.3)';
            modal.style.maxWidth = '400px';
            modal.style.width = '90%';

            modal.innerHTML = `
                <h2 style="margin-top: 0; color: #333;">Admin Authentication Required</h2>
                <p style="color: #666; margin-bottom: 20px;">Please enter admin credentials to access search history.</p>
                
                <div style="margin-bottom: 15px; text-align: left;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">Username</label>
                    <input type="text" id="admin-username" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
                </div>
                
                <div style="margin-bottom: 25px; text-align: left;">
                    <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #333;">Password</label>
                    <input type="password" id="admin-password" style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;">
                </div>
                
                <div id="admin-auth-message" style="margin-bottom: 15px; min-height: 20px; color: #d9534f;"></div>
                
                <div style="display: flex; gap: 10px; justify-content: center;">
                    <button id="admin-auth-submit" style="flex: 1; padding: 12px; background: #333; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
                        Authenticate
                    </button>
                    <button id="admin-auth-cancel" style="flex: 1; padding: 12px; background: #666; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">
                        Cancel
                    </button>
                </div>
            `;

            overlay.appendChild(modal);
            document.body.appendChild(overlay);

            // Focus on username field
            document.getElementById('admin-username').focus();

            // Handle submit
            document.getElementById('admin-auth-submit').addEventListener('click', authenticateAdmin);
            
            // Handle cancel
            document.getElementById('admin-auth-cancel').addEventListener('click', () => {
                document.body.removeChild(overlay);
                // Redirect to home page
                window.location.href = '/';
            });

            // Handle Enter key
            document.getElementById('admin-password').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    authenticateAdmin();
                }
            });
        }

        async function authenticateAdmin() {
            const username = document.getElementById('admin-username').value;
            const password = document.getElementById('admin-password').value;
            const messageDiv = document.getElementById('admin-auth-message');

            if (!username || !password) {
                messageDiv.style.color = '#d9534f';
                messageDiv.textContent = 'Please enter both username and password';
                return;
            }

            try {
                // Use basic auth for admin authentication
                const authString = btoa(`${username}:${password}`);
                
                const response = await fetch('/api/admin/search-history', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Basic ${authString}`
                    }
                });

                if (response.ok) {
                    // Store admin credentials for future API calls
                    localStorage.setItem('adminAuth', authString);
                    
                    // Remove modal
                    const overlay = document.getElementById('admin-auth-overlay');
                    if (overlay) {
                        document.body.removeChild(overlay);
                    }
                    
                    // Load the search history
                    loadHistory();
                } else {
                    messageDiv.style.color = '#d9534f';
                    messageDiv.textContent = 'Invalid admin credentials';
                }
            } catch (error) {
                console.error('Admin authentication error:', error);
                messageDiv.style.color = '#d9534f';
                messageDiv.textContent = 'Authentication failed. Please try again.';
            }
        }
    </script>
</body>
</html>
